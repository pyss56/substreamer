name: Build Android APK (local, no EAS)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build debug APK on GitHub runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Expo SDK 57 / RN 0.86 需要 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install npm dependencies
        run: npm ci

      # 本地生成原生 Android 工程（不需要 Expo 账号）
      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      # ubuntu-latest 已预装 Android SDK。不要用 android-actions/setup-android@v3：
      # 它会尝试安装已被 Google 移除的 `tools` 包，sdkmanager 报
      # "Failed to find package 'tools'" 并以 exit 1 让整个 action 失败。
      - name: Locate runner Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager -print -quit)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      # 读 Expo prebuild 生成的 android/build.gradle ext 块，装 gradle 期望的
      # compileSdk / build-tools / NDK（sed + `sed -n 1p`，避免 pipefail 下的 SIGPIPE）。
      - name: Install required SDK packages
        run: |
          EXT=android/build.gradle
          COMPILE_SDK=$(sed -nE 's/.*compileSdkVersion[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$EXT" | sed -n '1p')
          BUILD_TOOLS=$(sed -nE 's/.*buildToolsVersion[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$EXT" | sed -n '1p')
          NDK=$(sed -nE 's/.*ndkVersion[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$EXT" | sed -n '1p')
          if [ -z "$NDK" ]; then
            NDK=$(sed -nE 's/^ndkVersion[[:space:]]*=[[:space:]]*([^[:space:]]+).*/\1/p' android/gradle.properties | sed -n '1p')
          fi
          COMPILE_SDK=${COMPILE_SDK:-35}
          BUILD_TOOLS=${BUILD_TOOLS:-35.0.0}
          echo "compileSdk=$COMPILE_SDK  buildTools=$BUILD_TOOLS  ndk=${NDK:-<none>}"
          PKGS=("platform-tools" "platforms;android-$COMPILE_SDK" "build-tools;$BUILD_TOOLS")
          if [ -n "$NDK" ]; then PKGS+=("ndk;$NDK"); fi
          "$SDKMANAGER" "${PKGS[@]}"

      - name: Build debug APK
        env:
          GRADLE_OPTS: "-Xmx2048m -XX:MaxMetaspaceSize=512m"
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: substreamer-android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
